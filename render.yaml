services:
  - type: web
    name: dark-venus-bridge
    runtime: python
    rootDir: bridge
    buildCommand: pip install -r requirements.txt
    startCommand: python bridge.py
    healthCheckPath: /health
    envVars:
      - key: BRIDGE_CLIENT_ID
        value: 0000
      - key: PYTHON_VERSION
        value: 3.11.9
